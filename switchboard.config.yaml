# Switchboard config. Order of agents in `routing` = preference.
agents:
  claude:
    cmd: claude
    headlessArgs: ["-p", "--output-format", "json"]   # the prompt is inserted right after -p
    usageArgs: ["-p", "/usage"]      # prints "Current session: N% used ..." (recon rows 15)
    models: []
  agy:
    cmd: agy
    headlessArgs: ["-p", "--output-format", "json"]
    usageArgs: ["-p", "/quota"]      # prints per-group quota lines (recon row 16)
    settingsPath: "~/.gemini/antigravity-cli/settings.json"   # where agy reads permissions.allow (recon rounds 4-7)
    models: []

limits:
  staleAfterMin: 30       # data older than this is "unknown" (unless a window is exhausted)
  fetchTimeoutSec: 30     # timeout for one usage command

thresholds:               # tuned for Claude Pro (small 5h window)
  low: 60                 # % used -> status "мало"
  exhausted: 90           # % used -> unavailable for new tasks
  weeklyReserve: 75       # weekly above this: only priority=high tasks

routing:
  research: [agy, claude]
  ideas:    [agy, claude]
  copy:     [claude, agy]
  section:  [claude, agy]
  review:   [agy, claude]
  qa:       [agy, claude]

dashboard:
  refreshTtlSec: 60       # the dashboard re-reads limits at most this often while it is open
  projects: []            # extra project folders the dashboard form may start tasks in (~ allowed);
                          # projects added with `sb project add` or used by earlier tasks are allowed too
  manualCards:            # optional hand-set cards (no API); not used by the router. Use [] to hide.
    - { id: gemini-chat, title: "Gemini (чат)" }
    - { id: stitch, title: "Stitch" }

run:
  timeoutMin: 20          # one agent run is killed after this long

git:
  pushBranches: false     # true: push sb/<id> to origin after a run (Netlify deploy preview). Never pushes main.
  protectedPaths:         # a run that changes one of these files is marked "blocked" and is never pushed
    - netlify.toml
    - ".env*"

# Headless runs cannot ask for confirmation, so everything an agent may do is listed here.
# Anything not allowed is denied and reported as "blocked". No full permission bypass is used.
permissions:
  claude:
    allow:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - "Bash(git status*)"
      - "Bash(git diff*)"
      - "Bash(git log*)"
      - "Bash(pnpm run *)"
      - "Bash(pnpm build*)"
      - "Bash(pnpm test*)"
      - "Bash(npm run *)"
      - "Bash(npx astro *)"
      - "Bash(ls*)"
    deny:
      - "Bash(git push*)"
      - "Bash(git commit*)"
      - "Bash(git reset*)"
      - "Bash(git checkout*)"
      - "Bash(git switch*)"
      - "Bash(git merge*)"
      - "Bash(git rebase*)"
      - "Bash(git clean*)"
      - "Bash(rm -rf*)"
      - "Bash(sudo*)"
      - "Bash(curl*)"
      - "Bash(pnpm add*)"
      - "Bash(pnpm install*)"
      - "Bash(npm install*)"
      - "Read(./.env*)"
      - "Edit(./netlify.toml)"
      - "Write(./netlify.toml)"
  agy:
    # agy reads rules only from its USER-level settings file, so Switchboard adds these rules for the
    # duration of one run and removes exactly them afterwards ({project} = real path of the project).
    # Write access is a directory prefix (must end with "/"). Shell (`command(...)`) is deliberately
    # NOT granted: `deny` does not stop shell commands in agy (recon round 5), so it cannot be made safe.
    allow:
      - "write_file({project}/)"
    deny:                 # best effort: agy does not report these as denied_actions; protectedPaths is the safety net
      - "write_file({project}/.env)"
      - "write_file({project}/netlify.toml)"
    args: []

router:
  shortTypes: [section, copy, qa]     # an agent with status "мало" only takes these

# A run counts as "hit a usage limit" only when it FAILED and one of these regexes matches the LAST
# lines of its output (so a task text that merely mentions "quota" never triggers a handover).
# Add new wording here when you see a real limit message.
limitDetection:
  tailLines: 15
  patterns:
    - "usage limit"
    - "rate limit"
    - "quota"
    - "\\b429\\b"
    - "resets? at"
    - "limit reached"
    - "hit your .{0,20}limit"
    - "RESOURCE_EXHAUSTED"
    - "too many requests"
    - "limit will reset"

handoff:
  maxHandoffs: 2          # after this many handovers the task pauses and you are notified

notifications:
  enabled: true           # macOS system notification on pause (osascript)

chat:
  order: [claude, agy]    # which agent answers first in "Авто" mode (a chat keeps its last agent while it has room)
